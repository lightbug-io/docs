name: Branch preview build
on:
  workflow_dispatch:
  push:
    branches-ignore: [main, production, gh-pages]
permissions:
  contents: read
concurrency:
  group: branch-preview-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref_type == 'branch' && !contains(fromJSON('["main","production","gh-pages"]'), github.ref_name) && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci-preview]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          # No shared cache, secrets or publication credentials.
      - run: npm ci
      - run: node --test .github/preview/*.test.cjs
      - run: npm test -- --runInBand
      - name: Build static branch preview
        env:
          BRANCH_REF: ${{ github.ref }}
          DEPLOYMENT_NAME: Preview
        run: |
          ID=$(node -e 'process.stdout.write(require("node:crypto").createHash("sha256").update(process.env.BRANCH_REF).digest("hex"))')
          export PREVIEW_BASE="/docs/branch/$ID/"
          npm run build
          node .github/preview/check-base-paths.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: branch-preview-${{ github.sha }}-${{ github.run_attempt }}
          path: .vitepress/dist/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
