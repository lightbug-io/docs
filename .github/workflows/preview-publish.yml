name: Publish previews
on:
  workflow_run:
    workflows: [Preview build]
    types: [completed]
  workflow_dispatch:
  # Metadata-only cleanup: this workflow never checks out or executes PR code.
  pull_request_target:
    types: [closed, synchronize, converted_to_draft]
  schedule:
    - cron: '17 * * * *'
permissions: {}
# All publications and closed/stale PR cleanup share this lock. Never cancel a deployment.
concurrency:
  group: pages-preview-publisher
  cancel-in-progress: false
jobs:
  publish:
    if: vars.PREVIEWS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: github-pages
    permissions:
      contents: read
      actions: read
      pull-requests: read
      pages: write
      id-token: write
    steps:
      # Only trusted default-branch code; no PR checkout, npm, caches or artifact execution.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/preview
      - name: Assemble authorized current revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/preview/publish.py assemble
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: preview-site
          retention-days: 1
      - name: Revalidate immediately before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/preview/publish.py check
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        with:
          timeout: '300000'
      - name: Detect revisions changed during deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/preview/publish.py check
      # GitHub Pages has no atomic compare-and-swap against PR state. On any
      # failure, replace the whole preview site with an inert page, including if
      # the post-deployment check catches a change during deployment.
      - name: Prepare fail-closed recovery
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/preview-empty"
          printf '%s' '<!doctype html><title>Previews unavailable</title>' > "$RUNNER_TEMP/preview-empty/index.html"
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        id: recovery-upload
        if: failure()
        with:
          name: preview-empty
          path: ${{ runner.temp }}/preview-empty
          retention-days: 1
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        if: failure() && steps.recovery-upload.outcome == 'success'
        with:
          artifact_name: preview-empty
          timeout: '300000'
