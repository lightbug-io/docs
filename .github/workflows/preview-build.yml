name: Preview build
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: preview-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          # Deliberately no shared cache.
      - run: python3 -m unittest discover -s .github/preview -p 'test_*.py'
      - run: npm ci
      - name: Build static preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_PREFIX: ${{ vars.PREVIEW_PATH_PREFIX || '/docs' }}
          DEPLOYMENT_NAME: Preview
        run: |
          export PREVIEW_BASE="${PREVIEW_PREFIX%/}/pr/$PR_NUMBER/$PR_SHA/"
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-static
          path: .vitepress/dist/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
