product:
  name: RTKZero
  tagline: Compact dual-band RTK tracker
  description: >-
    A compact, lightweight RTK tracker with dual-band, multi-constellation GNSS,
    cellular, LoRa, Wi-Fi and Bluetooth connectivity. External helical antenna,
    simple button and LED controls, NFC card detection, rechargeable battery,
    and body-worn mounting options. *Preliminary product figures and estimates.
  version: Customer preview
  physical:
    size:
      body_dimensions: Approx. 53 × 91 × 15 mm* (antenna excluded)
      antenna_extension: Approx. 55 mm* added to body length
    weight: Approx. 90 g*
  integrations:
    processing:
      main_processor: STMicroelectronics STM32G0B1 32-bit Arm Cortex-M0+ MCU; up to 64 MHz, 512 KB Flash, 144 KB SRAM, 1.7–3.6 V supply.
      wireless_processor: Espressif ESP32-S31; two high-performance RISC-V cores and one low-power RISC-V core. 2.4 GHz Wi-Fi 6, Bluetooth 5.4 LE and Bluetooth Classic.*
    optional_add_ons:
      options: '[Optional Add on] Multi-device charging tray; wireless charging; higher-spec GNSS receiver; alternate antenna configurations; low-temperature battery; serviceable battery, backplate and contact assembly; breakaway belt clip.'
  connectivity:
    cellular:
      modem: SIMCom A7683E LTE Cat 1bis modem.
      bands: LTE-FDD bands B1, B3, B5, B7, B8, B20 and B28.*
      data_rate: Up to 10 Mbps downlink and 5 Mbps uplink.*
    lora:
      radio: Semtech LR2021 LoRa transceiver for 868 MHz and 2.4 GHz ISM operation.*
      modes: LoRa and FLRC modulation.*
    wifi_bluetooth:
      module: Espressif ESP32-S31.
      features: 2.4 GHz Wi-Fi 6, Bluetooth 5.4 LE and Bluetooth Classic.*
  positioning:
    gnss:
      receiver: Quectel LC29HEA, the same GNSS module used in RH2.
      bands: GPS/QZSS L1 C/A and L5; GLONASS L1; Galileo E1 and E5a; BeiDou B1I and B2a; NavIC L5.
      performance: Dual-band RTK positioning, with centimeter-class positioning capability.*
      update_rate: 5 Hz position reporting.*
      antenna: External helical GNSS antenna; approximately 55 mm additional length.*
  sensors:
    motion:
      accelerometer: ST LIS2DH three-axis accelerometer; selectable ±2 g, ±4 g, ±8 g or ±16 g range.*
    nfc:
      reader: Renesas PTX105R 13.56 MHz NFC reader with low-power card detection.
  battery:
    overall:
      capacity: 2,000 mAh LiPo battery.*
      runtime: Approximately 15 hours.*
    monitoring:
      monitor: Texas Instruments INA236 16-bit current, voltage and power monitor with I2C interface.
  user interface:
    controls:
      button: One physical button.
    indicators:
      led: One RGB status LED.
      audio: Piezo audio indicator.
    omitted:
      display: No screen.
      haptics: No haptic actuator.
      strobe: No strobe light.
