product:
  name: RTKZero
  tagline: Dual-band RTK GNSS tracker
  description: >-
    Preliminary hardware datasheet for a compact wearable RTK tracker with
    multi-constellation L1/L5 GNSS, LTE Cat 1bis, LoRa, Wi-Fi, Bluetooth, NFC,
    motion sensing, and a rechargeable 2,000 mAh battery.
  version: Preliminary hardware datasheet
  physical:
    dimensions:
      device_body: Approx. 53 × 91 × 15 mm, antenna excluded.*
      antenna_extension: Approx. 55 mm added to body length.*
    weight: Approx. 90 g.*
    environmental:
      ingress_protection: IP65 minimum; IP67 target.*
      operating_temperature: 0 to 60 °C. [Optional Add on] -20 to 60 °C operation.
  integrations:
    processing:
      primary_controller: STM32G0B1 application MCU.
      wireless_and_sensor_controller: ESP32-S31 wireless co-processor.
    external_interfaces:
      dock: Five-contact charging and data dock with I2C.*
  connectivity:
    cellular:
      modem: SIMCom A7683E LTE Cat 1bis.
      bands: LTE-FDD B1, B3, B5, B7, B8, B20 and B28.
      peak_data_rate: Up to 10 Mbps downlink and 5 Mbps uplink.
    lora:
      transceiver: Semtech LR2021.
      configured_bands: 868 MHz and 2.4 GHz ISM.
      modulations: LoRa and FLRC.
      chip_rate_limits: LoRa up to 125 kbps; FLRC up to 2.6 Mbps.
      chip_frequency_ranges: 150–960 MHz and 1.5–2.5 GHz.
    wifi_bluetooth:
      controller: Espressif ESP32-S31.
      wifi: 2.4 GHz Wi-Fi 6 (IEEE 802.11ax), 2412–2484 MHz.
      bluetooth: Bluetooth 5.4 LE, Bluetooth Classic and Bluetooth Audio support.
      other_chip_protocols: Zigbee 3.0 and Thread 1.4 (IEEE 802.15.4) silicon support.
  positioning:
    GNSS RTK:
      receiver: Quectel LC29HEA multi-constellation, dual-band GNSS receiver with RTK.
      constellations_and_bands: GPS/QZSS L1 C/A and L5; GLONASS L1; Galileo E1 and E5a; BeiDou B1I and B2a; NavIC L5.
      positioning_rate: Up to 10 Hz.
      rtk_accuracy: "Module specification: 1 cm + 1 ppm horizontal; 2.5 cm + 1 ppm vertical."
      rtk_accuracy_conditions: "Open sky, active high-precision antenna, and within 1 km of the base station."
      correction_and_output_protocols: RTCM 3.x corrections; NMEA 0183 output.
      module_sensitivity: Tracking sensitivity -165 dBm.
      time_to_first_fix: "With A-GNSS: 5 s cold start; without A-GNSS: 26 s cold, 16 s warm, 1 s hot start."
      dynamic_limits: Maximum altitude 10,000 m; maximum velocity 500 m/s; maximum acceleration 4 g.
      antenna: External high-gain helical GNSS antenna; L1/L2/L5; approximately 55 mm added length.*
      rf_connection: SMA antenna feed.*
  sensors:
    motion:
      main_processor_accelerometer: ST LIS3DH three-axis accelerometer; selectable ±2 g, ±4 g, ±8 g and ±16 g ranges; 1 Hz–5.3 kHz output data rate; 1.71–3.6 V supply; -40 to +85 °C component operating range.
      6-axis: ST LSM6DS3TR six-axis inertial module with three-axis accelerometer and three-axis gyroscope. Accelerometer ranges are ±2/±4/±8/±16 g; gyroscope ranges are ±125/±245/±500/±1000/±2000 dps. I2C interface; -40 to +85 °C component operating range.
      3-axis magnetometer: ST LIS2MDL three-axis digital magnetometer; ±50 gauss magnetic range and 16-bit output. I2C interface; -40 to +85 °C component operating range.
    NFC:
      reader: Renesas PTX105R 13.56 MHz NFC reader with low-power card detection.
      chip_host_interfaces: I2C, SPI and UART support.
  battery:
    pack:
      capacity: 2,000 mAh LiPo.
      runtime: 15 hours at 1 Hz positioning with full RTK.
  charging:
    electrical_input: 5–14 V input; charge rate up to 3 A.
  user interface:
    controls:
      button: One physical button.
    indicators:
      status_led: One RGB status LED.
      audio: Piezo audio indicator.
    omitted_features:
      display: No display.
      haptics: No haptic actuator.
      strobe: No strobe light.
  components:
    main_accelerometer:
      manufacturer_and_model: STMicroelectronics LIS3DH.
      capabilities: Three-axis digital accelerometer; selectable ±2/±4/±8/±16 g full scales; output data rates from 1 Hz to 5.3 kHz.
      supply_voltage: 1.71–3.6 V.
      component_operating_temperature: -40 to +85 °C.
    6-axis:
      manufacturer_and_model: STMicroelectronics LSM6DS3TR.
      capabilities: Three-axis digital accelerometer with ±2/±4/±8/±16 g full scales and three-axis digital gyroscope with ±125/±245/±500/±1000/±2000 dps full scales.
      interface: I2C.
      component_operating_temperature: -40 to +85 °C.
    magnetometer:
      manufacturer_and_model: STMicroelectronics LIS2MDL.
      capabilities: Three-axis digital magnetometer with ±50 gauss magnetic range and 16-bit output.
      interface: I2C.
      component_operating_temperature: -40 to +85 °C.
    main_processor:
      manufacturer_and_model: STMicroelectronics STM32G0B1.
      cpu_and_clock: 32-bit Arm Cortex-M0+ CPU, up to 64 MHz.
      memory: Up to 512 KB flash and 144 KB SRAM.
      peripheral_capabilities: Six USARTs, ADC, DAC, FDCAN, SPI and I2C peripherals.
      component_temperature_grades: -40 °C to +85 °C, +105 °C or +125 °C depending on fitted device grade.
    wireless_processor:
      manufacturer_and_model: Espressif ESP32-S31.
      cpu: Two high-performance RISC-V cores and one low-power RISC-V core.
      memory_options: 16 MB or 32 MB in-package PSRAM by part-number variant; variant not specified.
      radio: 2.4 GHz Wi-Fi 6, Bluetooth 5.4 LE, Bluetooth Classic, Zigbee 3.0 and Thread 1.4.
      component_operating_temperature: -40 to +85 °C for listed package variants.
    cellular_modem:
      manufacturer_and_model: SIMCom A7683E LTE Cat 1bis.
    lora_transceiver:
      manufacturer_and_model: Semtech LR2021.
      supply_voltage: 1.8–3.7 V.
      maximum_output_power: Up to +22 dBm sub-GHz and +12 dBm at 2.4 GHz (IC limits).
      component_operating_temperature: -40 to +85 °C.
    gnss_module:
      manufacturer_and_model: Quectel LC29HEA.
      module_size_and_mass: 12.2 × 16.0 × 2.5 mm; approximately 0.9 g.
      supply_voltage: 3.1–3.6 V, typical 3.3 V.
      module_interfaces: Two UARTs, I2C and multiplexed SPI.
    battery_monitor:
      manufacturer_and_model: Texas Instruments INA236.
      capabilities: 16-bit current, voltage and power monitoring; high-side or low-side sensing; -0.3–48 V common-mode input range.
      supply_and_interfaces: 1.7–5.5 V supply; I2C/SMBus interface.
      component_operating_temperature: -40 to +125 °C.
    optional_add_ons:
      multi_device_tray: 'Optional: multi-device charging tray.'
      wireless_charging: 'Optional: wireless charging.'
      gnss_and_antennas: 'Optional: higher-spec GNSS receiver or alternate antenna configurations.'
      cold_weather_battery: 'Optional: low-temperature battery.'
      serviceable_pack: 'Optional: serviceable battery, backplate and contact assembly.'
      breakaway_clip: 'Optional: breakaway belt clip.'
