<!-- cspell:ignore labelledby dasharray -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 325" role="img" aria-labelledby="title desc">
  <title id="title">Charging blink shown in two static frames</title>
  <desc id="desc">At three bars, the first two lights remain on, the third alternates on and off roughly every second, and the fourth remains off.</desc>
  <rect width="720" height="325" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033"><text x="28" y="39" font-size="24" font-weight="700" text-anchor="start" fill="#172033">Charging: the highest lit bar blinks</text>
<text x="28" y="68" font-size="16" font-weight="400" text-anchor="start" fill="#172033">Example at 60% to below 80% charge. The fourth light stays off.</text>
<text x="28" y="125" font-size="17" font-weight="700" text-anchor="start" fill="#172033">About 1 second</text>
<rect x="254" y="103" width="47" height="28" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="320" y="103" width="47" height="28" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="386" y="103" width="47" height="28" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="452" y="103" width="47" height="28" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="550" y="125" font-size="16" font-weight="400" text-anchor="start" fill="#172033">Third light on</text>
<text x="28" y="207" font-size="17" font-weight="700" text-anchor="start" fill="#172033">About 1 second</text>
<rect x="254" y="185" width="47" height="28" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="320" y="185" width="47" height="28" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="386" y="185" width="47" height="28" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="452" y="185" width="47" height="28" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="550" y="207" font-size="16" font-weight="400" text-anchor="start" fill="#172033">Third light off</text>
<path d="M412 145 L412 166 M406 160 L412 166 L418 160" fill="none" stroke="#334155" stroke-width="2"/><text x="28" y="269" font-size="18" font-weight="700" text-anchor="start" fill="#172033">The two frames repeat below about 95%.</text>
<text x="28" y="297" font-size="17" font-weight="400" text-anchor="start" fill="#172033">Near full charge, the normal display becomes steady.</text>
</g>
</svg>
