<!-- cspell:ignore labelledby rect -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 397" role="img" aria-labelledby="title desc">
<title id="title">Vehicle ignition and charging pairs</title><desc id="desc">Logical LEDs 1 and 2 flash for ignition high. LEDs 3 and 4 flash for charging. Both pairs flash if both conditions are true. Five cycles with 0.3 seconds on and 0.2 seconds off. Shading is not a physical LED colour.</desc>
<rect width="720" height="397" rx="16" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#172033"><text x="28" y="38" font-size="25" font-weight="700">Vehicle connection display</text><text x="28" y="66" font-size="16" font-weight="400">Logical indicator numbers, not physical positions or LED colours.</text><text x="304" y="104" font-size="17" font-weight="700">1</text><text x="371" y="104" font-size="17" font-weight="700">2</text><text x="438" y="104" font-size="17" font-weight="700">3</text><text x="505" y="104" font-size="17" font-weight="700">4</text><text x="28" y="147" font-size="18" font-weight="700">Ignition high</text><rect x="292" y="126" width="42" height="28" rx="7" fill="#475569" stroke="#334155" stroke-width="2"/><rect x="359" y="126" width="42" height="28" rx="7" fill="#475569" stroke="#334155" stroke-width="2"/><rect x="426" y="126" width="42" height="28" rx="7" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><rect x="493" y="126" width="42" height="28" rx="7" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><text x="28" y="215" font-size="18" font-weight="700">Charging</text><rect x="292" y="194" width="42" height="28" rx="7" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><rect x="359" y="194" width="42" height="28" rx="7" fill="#e2e8f0" stroke="#334155" stroke-width="2"/><rect x="426" y="194" width="42" height="28" rx="7" fill="#475569" stroke="#334155" stroke-width="2"/><rect x="493" y="194" width="42" height="28" rx="7" fill="#475569" stroke="#334155" stroke-width="2"/><text x="28" y="283" font-size="18" font-weight="700">Both</text><rect x="292" y="262" width="42" height="28" rx="7" fill="#475569" stroke="#334155" stroke-width="2"/><rect x="359" y="262" width="42" height="28" rx="7" fill="#475569" stroke="#334155" stroke-width="2"/><rect x="426" y="262" width="42" height="28" rx="7" fill="#475569" stroke="#334155" stroke-width="2"/><rect x="493" y="262" width="42" height="28" rx="7" fill="#475569" stroke="#334155" stroke-width="2"/><text x="28" y="333" font-size="18" font-weight="700">5 cycles: about 0.3 seconds on, then 0.2 seconds off.</text><text x="28" y="365" font-size="16" font-weight="400">Dark fill = on. Pale fill = off. Both pairs may flash normally.</text></g></svg>
