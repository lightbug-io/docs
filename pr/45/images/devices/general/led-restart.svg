<!-- cspell:ignore labelledby dasharray -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 330" role="img" aria-labelledby="title desc">
  <title id="title">Six-indicator restart example</title>
  <desc id="desc">Four orange battery lights, then red GPS and mobile-network status lights. This pattern alone does not mean a fault or a full battery.</desc>
  <rect width="700" height="330" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033"><text x="30" y="40" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Restart example: 4 orange + 2 red</text>
<text x="30" y="70" font-size="17" font-weight="400" text-anchor="start" fill="#172033">Match the icons on your tracker to these groups.</text>
<rect x="28" y="98" width="644" height="102" rx="22" fill="#253044"/>
<rect x="66" y="130" width="44" height="26" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="128" y="130" width="44" height="26" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="190" y="130" width="44" height="26" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="252" y="130" width="44" height="26" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="423" y="130" width="44" height="26" rx="8" fill="#ef4444" stroke="#334155" stroke-width="2"/>
<rect x="559" y="130" width="44" height="26" rx="8" fill="#ef4444" stroke="#334155" stroke-width="2"/>
<text x="181" y="232" font-size="19" font-weight="700" text-anchor="middle" fill="#172033">Battery lights</text>
<text x="445" y="232" font-size="19" font-weight="700" text-anchor="middle" fill="#172033">GPS</text>
<text x="581" y="232" font-size="19" font-weight="700" text-anchor="middle" fill="#172033">Mobile</text>
<text x="181" y="258" font-size="17" font-weight="400" text-anchor="middle" fill="#172033">4 orange</text>
<text x="445" y="258" font-size="17" font-weight="400" text-anchor="middle" fill="#172033">Red</text>
<text x="581" y="258" font-size="17" font-weight="400" text-anchor="middle" fill="#172033">Red</text>
<text x="30" y="302" font-size="18" font-weight="700" text-anchor="start" fill="#172033">Can appear during a restart. Check that updates resume.</text>
</g>
</svg>
