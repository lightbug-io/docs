<!-- cspell:ignore labelledby dasharray -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 466" role="img" aria-labelledby="title desc">
  <title id="title">Battery level thresholds</title>
  <desc id="desc">Below 20 percent: first light flashes off charge. At least 20, 40, 60, and 80 percent: one, two, three, and four lights respectively.</desc>
  <rect width="720" height="466" rx="16" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#172033"><text x="28" y="39" font-size="25" font-weight="700" text-anchor="start" fill="#172033">Normal battery display</text>
<text x="28" y="67" font-size="16" font-weight="400" text-anchor="start" fill="#172033">Approximate charge. Startup and alerts use different patterns.</text>
<text x="28" y="121" font-size="17" font-weight="700" text-anchor="start" fill="#172033">Below 20%</text>
<rect x="245" y="98" width="38" height="27" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="297" y="98" width="38" height="27" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="349" y="98" width="38" height="27" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="401" y="98" width="38" height="27" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="241" y="94" width="46" height="35" rx="11" fill="none" stroke="#9a6700" stroke-width="2" stroke-dasharray="4 3"/><text x="468" y="119" font-size="15" font-weight="400" text-anchor="start" fill="#172033">First light flashes off charge</text>
<text x="28" y="186" font-size="17" font-weight="700" text-anchor="start" fill="#172033">20% to below 40%</text>
<rect x="245" y="163" width="38" height="27" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="297" y="163" width="38" height="27" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="349" y="163" width="38" height="27" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="401" y="163" width="38" height="27" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="468" y="184" font-size="15" font-weight="400" text-anchor="start" fill="#172033">1 light</text>
<text x="28" y="251" font-size="17" font-weight="700" text-anchor="start" fill="#172033">40% to below 60%</text>
<rect x="245" y="228" width="38" height="27" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="297" y="228" width="38" height="27" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="349" y="228" width="38" height="27" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<rect x="401" y="228" width="38" height="27" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="468" y="249" font-size="15" font-weight="400" text-anchor="start" fill="#172033">2 lights</text>
<text x="28" y="316" font-size="17" font-weight="700" text-anchor="start" fill="#172033">60% to below 80%</text>
<rect x="245" y="293" width="38" height="27" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="297" y="293" width="38" height="27" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="349" y="293" width="38" height="27" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="401" y="293" width="38" height="27" rx="8" fill="#e2e8f0" stroke="#334155" stroke-width="2"/>
<text x="468" y="314" font-size="15" font-weight="400" text-anchor="start" fill="#172033">3 lights</text>
<text x="28" y="381" font-size="17" font-weight="700" text-anchor="start" fill="#172033">80% or more</text>
<rect x="245" y="358" width="38" height="27" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="297" y="358" width="38" height="27" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="349" y="358" width="38" height="27" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<rect x="401" y="358" width="38" height="27" rx="8" fill="#f59e0b" stroke="#334155" stroke-width="2"/>
<text x="468" y="379" font-size="15" font-weight="400" text-anchor="start" fill="#172033">4 lights</text>
<text x="28" y="442" font-size="18" font-weight="700" text-anchor="start" fill="#172033">4 lights start at 80%, not only when fully charged.</text>
</g>
</svg>
