<!-- cspell:ignore labelledby rect -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-labelledby="title desc">
<title id="title">RH2 charging colours</title><desc id="desc">Red below 30 percent, orange from 30 to below 70, yellow-green from 70 to below 90 and green at 90 or more. Brightness varies in half-second steps below about 99 percent and is steady at about 99 percent or more.</desc>
<rect width="720" height="450" rx="16" fill="#f8fafc"/><g font-family="Arial, Helvetica, sans-serif" fill="#172033"><text x="28" y="38" font-size="25" font-weight="700">RH2: RGB charging status</text><text x="28" y="66" font-size="16" font-weight="400">Charge level changes the colour, not a count of battery bars.</text><text x="28" y="127" font-size="18" font-weight="700">Below 30%</text><rect x="285" y="104" width="42" height="28" rx="7" fill="#dc2626" stroke="#334155" stroke-width="2"/><text x="358" y="127" font-size="18" font-weight="400">Red</text><text x="28" y="187" font-size="18" font-weight="700">30% to below 70%</text><rect x="285" y="164" width="42" height="28" rx="7" fill="#f97316" stroke="#334155" stroke-width="2"/><text x="358" y="187" font-size="18" font-weight="400">Orange</text><text x="28" y="247" font-size="18" font-weight="700">70% to below 90%</text><rect x="285" y="224" width="42" height="28" rx="7" fill="#b5cd22" stroke="#334155" stroke-width="2"/><text x="358" y="247" font-size="18" font-weight="400">Yellow-green</text><text x="28" y="307" font-size="18" font-weight="700">90% or more</text><rect x="285" y="284" width="42" height="28" rx="7" fill="#22a05b" stroke="#334155" stroke-width="2"/><text x="358" y="307" font-size="18" font-weight="400">Green</text><text x="28" y="357" font-size="17" font-weight="700">Below about 99%: brightness varies in half-second steps.</text><text x="28" y="386" font-size="17" font-weight="400">At about 99% or above: the charging display is steady.</text><text x="28" y="420" font-size="16" font-weight="400">Green starts at 90%. It does not mean an RTK fix or upload.</text></g></svg>
